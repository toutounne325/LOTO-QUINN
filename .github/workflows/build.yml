name: Fabriquer APK Loto Quine

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Recuperer le code
        uses: actions/checkout@v4

      - name: 2. Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: 4. Generer le projet Android, activer la Camera OCR et compiler l'APK
        run: |
          flutter create --platforms=android --org com.piratepips app_loto
          MAIN_FILE=$(find . -maxdepth 2 -name "main.dart" | head -n 1)
          cp "$MAIN_FILE" app_loto/lib/main.dart
          cd app_loto
          sed -i 's/<application/<uses-permission android:name="android.permission.CAMERA"\/>\n    <application/g' android/app/src/main/AndroidManifest.xml
          cat << 'EOF' > android/app/proguard-rules.pro
          -keep class com.google.mlkit.** { *; }
          -dontwarn com.google.mlkit.**
          -keep class com.google.android.gms.** { *; }
          -dontwarn com.google.android.gms.**
          EOF
          if [ -f "android/app/build.gradle.kts" ]; then
            sed -i 's/isMinifyEnabled = true/isMinifyEnabled = false/g' android/app/build.gradle.kts
            sed -i 's/isShrinkResources = true/isShrinkResources = false/g' android/app/build.gradle.kts
          fi
          if [ -f "android/app/build.gradle" ]; then
            sed -i 's/minifyEnabled true/minifyEnabled false/g' android/app/build.gradle
            sed -i 's/shrinkResources true/shrinkResources false/g' android/app/build.gradle
          fi
          flutter pub add shared_preferences image_picker google_mlkit_text_recognition
          flutter build apk --release

      - name: 5. Rendre le fichier APK telechargeable
        uses: actions/upload-artifact@v4
        with:
          name: Application-Loto-Quine-Android
          path: app_loto/build/app/outputs/flutter-apk/app-release.apk
